<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="2560" height="640" viewBox="0 0 2560 640" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Quiet base: a slow vertical lift, so the field is not a flat fill but
         still reads as one colour. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#242038"/>
      <stop offset="0.5"  stop-color="#2E2950"/>
      <stop offset="1"    stop-color="#242038"/>
    </linearGradient>

    <!-- Light behind the lockup. Very low opacity: it should register as the
         surface being lit, never as a shape. -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"   stop-color="#CBFD03" stop-opacity="0.10"/>
      <stop offset="0.55" stop-color="#0D1CC4" stop-opacity="0.07"/>
      <stop offset="1"   stop-color="#0D1CC4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1"    stop-color="#000000" stop-opacity="0.36"/>
    </radialGradient>

    <!-- Fine hairline grid: structure you notice only if you look. -->
    <pattern id="grid" patternUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <path d="M64 0 L0 0 0 64" fill="none" stroke="#FFFFFF" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="2560" height="640" fill="url(#bg)"/>
  <rect x="0" y="0" width="2560" height="640" fill="url(#grid)"/>
  <ellipse cx="1280" cy="320" rx="1005" ry="461" fill="url(#glow)"/>
  <rect x="0" y="0" width="2560" height="640" fill="url(#vignette)"/>

  <!-- The mark: facing selection brackets around a single point. Says "one
       thing chosen from a field". A rounded square with a dot was rejected
       after render: at this weight it is the media-record glyph. Kept
       deliberately open at the top and bottom so it does not close into a
       frame, and sized to the cap band so it locks to the type. -->
  <g fill="none" stroke="#CBFD03" stroke-width="12.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M641.4 248.1 H582.4 V395.5 H641.4"/>
    <path d="M670.8 248.1 H729.8 V395.5 H670.8"/>
  </g>
  <circle cx="656.1" cy="321.8" r="19.9" fill="#FFFFFF"/>

  <!-- Wordmark, set in Plus Jakarta Sans Bold and converted to outlines. -->
  <g transform="translate(797.6 395.5) scale(0.197821 -0.197821)"
